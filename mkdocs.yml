site_name: Skapersøk docs
site_url: https://docs.skapersok.no

theme:
  name: material
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode

extra_css:
  - stylesheet/extra.css

nav:
  - Home: index.md
  - Introduction: introduction

  - Getting Started:
      - Overview: getting_started
      - App Setup: getting_started/app_setup
      - Server Setup: getting_started/server_setup

  - The Skapersøk System:
      - Placement Codes: system/placement_codes
      - Grid System: system/grids

  - Usage:
      - Join Links: JoinLinks

  - Developer:
      - Overview: developer
      - API Reference: developer/APIReference
      - Database layout: developer/database_layout
      - Database setup: developer/database_setup
