site_name: Skapersøk docs
site_url: https://docs.skapersok.no

theme:
  name: material
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
